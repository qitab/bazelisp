name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install SBCL
      run: |
        sudo apt-get update
        sudo apt-get install -y sbcl

    - name: Build Lisp Files
      run: |
        bazel build --enable_bzlmod=false //...

    - name: Run Tests
      run: |
        bazel test --enable_bzlmod=false --test_output=errors //...
